<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <pattern id="gridPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
    </pattern>
    <pattern id="dotPattern" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2" fill="rgba(255,255,255,0.28)"/>
    </pattern>
  </defs>

  <!-- Glow / Drop shadow effect -->
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.3"/>
  </filter>

  <g filter="url(#shadow)">
    <!-- Top Face -->
    <polygon points="256,60 440,166 256,272 72,166" fill="url(#topGrad)"/>
    <polygon points="256,60 440,166 256,272 72,166" fill="url(#gridPattern)"/>

    <!-- Left Face -->
    <polygon points="72,166 256,272 256,462 72,356" fill="url(#leftGrad)"/>
    <polygon points="72,166 256,272 256,462 72,356" fill="url(#dotPattern)"/>

    <!-- Right Face -->
    <polygon points="256,272 440,166 440,356 256,462" fill="url(#rightGrad)"/>

    <!-- Dynamic relief texture lines on Right Face -->
    <path d="M 256,300 L 440,194 M 256,330 L 440,224 M 256,360 L 440,254 M 256,390 L 440,284 M 256,420 L 440,314" 
          stroke="rgba(255,255,255,0.2)" stroke-width="2.5" fill="none"/>

    <!-- Sharp Highlights on Edges -->
    <line x1="256" y1="60" x2="440" y2="166" stroke="rgba(255,255,255,0.45)" stroke-width="2.5"/>
    <line x1="256" y1="60" x2="72" y2="166" stroke="rgba(255,255,255,0.5)" stroke-width="2.5"/>
    <line x1="256" y1="60" x2="256" y2="272" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <line x1="256" y1="272" x2="256" y2="462" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>
    <line x1="72" y1="166" x2="256" y2="272" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <line x1="440" y1="166" x2="256" y2="272" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  </g>
</svg>
